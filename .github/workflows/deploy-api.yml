# Deploys AssetFlow (C# API + React frontend) to Azure App Service on every push to main.
# The React app is built into the API's wwwroot folder, so one App Service serves both.
# Tests run first: if any test fails, nothing is deployed.
#
# Needs one GitHub secret: AZURE_API_PUBLISH_PROFILE
# (Azure Portal → App Service → Overview → Download publish profile)
name: Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "web/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: # also allows a manual "Run workflow" button in the Actions tab

env:
  AZURE_WEBAPP_NAME: assetflow-api-akmal

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test API
        run: dotnet test --configuration Release

      - name: Test and build frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Publish API with the frontend inside
        run: |
          dotnet publish src/AssetFlow.Api --configuration Release --output ./publish
          mkdir -p ./publish/wwwroot
          cp -r web/dist/. ./publish/wwwroot/

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: ./publish